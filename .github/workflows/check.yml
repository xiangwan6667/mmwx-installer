name: Installer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck jq
      - run: bash -n install.sh && bash -n bootstrap.sh && shellcheck install.sh bootstrap.sh tests/*.sh
      - run: sudo bash tests/test.sh && sudo bash tests/lifecycle.sh && sudo bash tests/resume.sh && sudo bash tests/update-resume.sh && sudo bash tests/dns.sh
      - run: sudo bash tests/firewall-migration.sh && sudo bash tests/uninstall.sh && sudo bash tests/management.sh
      - run: sudo bash tests/network-restore.sh
      - run: sudo bash tests/layout.sh
      - run: sudo bash tests/output-dependencies.sh && sudo bash tests/sync-lock.sh
      - run: sudo bash tests/entrypoint.sh && sudo bash tests/self-update.sh
      - run: sudo bash tests/registry.sh && sudo bash tests/available-version.sh
      - run: sudo bash tests/reinstall.sh && sudo bash tests/update-isolation.sh
      - run: sudo bash tests/caddy-management.sh && sudo bash tests/caddy-token.sh && sudo bash tests/caddy-lock.sh
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ufw ipset jq
      - run: sudo bash tests/persistence.sh
      - run: sudo bash tests/caddy-runtime.sh
      - run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT bash tests/firewall-live.sh
