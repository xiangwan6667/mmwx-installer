name: Build Caddy release assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caddy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
      - run: xcaddy build v2.11.4 --with github.com/caddy-dns/cloudflare@v0.2.4 --output caddy-linux-${{ matrix.arch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
      - run: gzip -n caddy-linux-${{ matrix.arch }} && sha256sum caddy-linux-${{ matrix.arch }}.gz > SHA256SUMS-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: caddy-linux-${{ matrix.arch }}
          path: |
            caddy-linux-*.gz
            SHA256SUMS-*
